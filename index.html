<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Manyatta Kenya | Luxury Hospitality</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <script defer src="https://cdn.tailwindcss.com"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof tailwind !== 'undefined') {
          tailwind.config = {
            theme: {
              extend: {
                colors: {
                  primary: '#DD5536',
                  dark: '#2F2F2F',
                  light: '#F9FAFB',
                },
                fontFamily: {
                  serif: ['"Cormorant Garamond"', 'serif'],
                  sans: ['"Inter"', 'sans-serif'],
                },
              },
            },
          };
        }
      });
    </script>

    <link rel="stylesheet" href="/index.css" />

    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #DD5536; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #b94226; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
      }
      .sr-only.focus\:not-sr-only:focus {
        position: static; width: auto; height: auto; padding: inherit; margin: inherit;
        overflow: visible; clip: auto; white-space: normal;
      }
      #root:empty::after {
        content: '';
        display: block;
        width: 40px;
        height: 40px;
        margin: 40vh auto;
        border: 3px solid #e5e7eb;
        border-top-color: #DD5536;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-white text-dark font-sans antialiased">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.style.padding = '40px 20px';
          root.style.textAlign = 'center';
          root.style.fontFamily = 'sans-serif';
          root.innerHTML = '<div style="max-w: 500px; margin: 40px auto; padding: 24px; border: 1px solid #fee2e2; background: #fff5f5; border-radius: 12px; color: #991b1b;"><h2 style="font-size: 20px; font-weight: 600; margin-bottom: 8px;">Application Error</h2><p style="font-size: 14px; color: #7f1d1d; margin-bottom: 16px;">' + (e.message || 'An error occurred while launching the application.') + '</p><button onclick="window.location.reload()" style="background: #DD5536; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Reload Page</button></div>';
        }
      });
    </script>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
