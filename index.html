<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Manyatta Kenya | Luxury Hospitality</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <script defer src="https://cdn.tailwindcss.com"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (typeof tailwind !== 'undefined') {
          tailwind.config = {
            theme: {
              extend: {
                colors: {
                  primary: '#DD5536',
                  dark: '#2F2F2F',
                  light: '#F9FAFB',
                },
                fontFamily: {
                  serif: ['"Cormorant Garamond"', 'serif'],
                  sans: ['"Inter"', 'sans-serif'],
                },
              },
            },
          };
        }
      });
    </script>

    <link rel="stylesheet" href="/index.css" />

    <style>
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #DD5536; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #b94226; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;
      }
      .sr-only.focus\:not-sr-only:focus {
        position: static; width: auto; height: auto; padding: inherit; margin: inherit;
        overflow: visible; clip: auto; white-space: normal;
      }
      #root:empty::after {
        content: '';
        display: block;
        width: 40px;
        height: 40px;
        margin: 40vh auto;
        border: 3px solid #e5e7eb;
        border-top-color: #DD5536;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-white text-dark font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
